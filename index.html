  <!-- FadingVideo：rAF 驱动的自循环淡入淡出 -->
  <script type="text/babel">
    (function () {
      const FADE_MS = 500;
      const FADE_OUT_LEAD = 0.55;

      function FadingVideo({ src, className = "", style }) {
        const videoRef = React.useRef(null);
        const rafRef = React.useRef(0);
        const restartRef = React.useRef(0);
        const fadingOutRef = React.useRef(false);

        React.useEffect(function () {
          const video = videoRef.current;
          if (!video) return undefined;

          let started = false;
          fadingOutRef.current = false;

          function fadeTo(target, duration) {
            const total = duration || FADE_MS;
            cancelAnimationFrame(rafRef.current);
            const from = parseFloat(video.style.opacity || "0");
            const startTime = performance.now();

            function frame(now) {
              const progress = Math.min((now - startTime) / total, 1);
              video.style.opacity = String(from + (target - from) * progress);
              if (progress < 1) {
                rafRef.current = requestAnimationFrame(frame);
              }
            }

            rafRef.current = requestAnimationFrame(frame);
          }

          function onLoadedData() {
            if (started) return;
            started = true;
            video.style.opacity = "0";
            const promise = video.play();
            if (promise && promise.catch) promise.catch(function () {});
            fadeTo(1);
          }

          function onTimeUpdate() {
            if (fadingOutRef.current) return;
            if (!video.duration) return;
            const remaining = video.duration - video.currentTime;
            if (remaining <= FADE_OUT_LEAD && remaining > 0) {
              fadingOutRef.current = true;
              fadeTo(0);
            }
          }

          function onEnded() {
            video.style.opacity = "0";
            clearTimeout(restartRef.current);
            restartRef.current = window.setTimeout(function () {
              video.currentTime = 0;
              const promise = video.play();
              if (promise && promise.catch) promise.catch(function () {});
              fadingOutRef.current = false;
              fadeTo(1);
            }, 100);
          }

          video.addEventListener("loadeddata", onLoadedData);
          video.addEventListener("timeupdate", onTimeUpdate);
          video.addEventListener("ended", onEnded);

          if (video.readyState >= 2) {
            onLoadedData();
          }

          return function () {
            started = false;
            cancelAnimationFrame(rafRef.current);
            clearTimeout(restartRef.current);
            video.removeEventListener("loadeddata", onLoadedData);
            video.removeEventListener("timeupdate", onTimeUpdate);
            video.removeEventListener("ended", onEnded);
          };
        }, [src]);

        return (
          <video
            ref={videoRef}
            className={className}
            style={{ ...(style || {}), opacity: 0 }}
            autoPlay
            muted
            playsInline
            preload="auto"
            aria-hidden="true"
          >
            <source src={src} type="video/mp4" />
          </video>
        );
      }

      window.FadingVideo = FadingVideo;
    })();
  </script>

  <!-- BlurText：逐词模糊入场 -->
  <script type="text/babel">
    (function () {
      const { motion } = window.Motion;

      function BlurText({
        text,
        as = "p",
        className = "",
        delay = 0,
        wordGap = "0.28em"
      }) {
        const ref = React.useRef(null);
        const [visible, setVisible] = React.useState(false);

        React.useEffect(function () {
          const el = ref.current;
          if (!el) return undefined;
          const observer = new IntersectionObserver(
            function (entries) {
              if (entries[0].isIntersecting) {
                setVisible(true);
                observer.disconnect();
              }
            },
            { threshold: 0.1 }
          );
          observer.observe(el);
          return function () {
            observer.disconnect();
          };
        }, []);

        const MotionTag = motion[as] || motion.p;
        const words = text.split(" ").filter(Boolean);

        return (
          <MotionTag
            ref={ref}
            className={className}
            style={{
              display: "flex",
              flexWrap: "wrap",
              justifyContent: "center",
              rowGap: "0.1em"
            }}
          >
            {words.map(function (word, index) {
              return (
                <motion.span
                  key={word + "-" + index}
                  style={{ display: "inline-block", marginRight: wordGap }}
                  initial={{ filter: "blur(10px)", opacity: 0, y: 50 }}
                  animate={
                    visible
                      ? {
                          filter: ["blur(10px)", "blur(5px)", "blur(0px)"],
                          opacity: [0, 0.5, 1],
                          y: [50, -5, 0]
                        }
                      : undefined
                  }
                  transition={{
                    duration: 0.7,
                    times: [0, 0.5, 1],
                    ease: "easeOut",
                    delay: delay + (index * 100) / 1000
                  }}
                >
                  {word}
                </motion.span>
              );
            })}
          </MotionTag>
        );
      }

      window.BlurText = BlurText;
    })();
  </script>

          function () {
            setOpen(false);
          },
          [route]
        );

        React.useEffect(
          function () {
            if (!open) return undefined;
            const previousOverflow = document.body.style.overflow;
            document.body.style.overflow = "hidden";
            function onKeyDown(event) {
              if (event.key === "Escape") setOpen(false);
            }
            window.addEventListener("keydown", onKeyDown);
            return function () {
              document.body.style.overflow = previousOverflow;
              window.removeEventListener("keydown", onKeyDown);

          },

        );

        return (
          <header className="fixed inset-x-0 top-4 z-50 px-8 lg:px-16">

  <!-- 路由与挂载 -->
  <script type="text/babel">
    (function () {
      const ROUTES = ["home", "voyages", "source", "innovation", "launch"];

      function getRoute() {
        const raw = (window.location.hash || "").replace(/^#\/?/, "").split("?")[0];
        return ROUTES.indexOf(raw) !== -1 ? raw : "home";
      }

      function App() {
        const [route, setRoute] = React.useState(getRoute());

        React.useEffect(function () {
          function sync() {
            setRoute(getRoute());
            window.scrollTo(0, 0);
          }
          window.addEventListener("hashchange", sync);
          return function () {
            window.removeEventListener("hashchange", sync);
          };
        }, []);

        React.useEffect(
          function () {
            const titles = {
              home: "菜鸟驿站 · 纯 C 控制台物流系统",
              voyages: "航程 · 菜鸟驿站",
              source: "源码 · 菜鸟驿站",
              innovation: "创新 · 菜鸟驿站",
              launch: "启程 · 菜鸟驿站"
            };
            document.title = titles[route] || titles.home;
          },
          [route]
        );

        return (
          <div className="min-h-screen bg-black">
            <window.Navbar route={route} />
            {route === "home" ? <window.HomePage /> : null}
            {route === "voyages" ? <window.VoyagesPage /> : null}
            {route === "source" ? <window.SourcePage /> : null}
            {route === "innovation" ? <window.InnovationPage /> : null}
            {route === "launch" ? <window.LaunchPage /> : null}
          </div>
        );
      }

      window.App = App;

      ReactDOM.createRoot(document.getElementById("root")).render(<App />);
    })();
  </script>
